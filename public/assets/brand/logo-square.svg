    <path d="M40 50 C40 38.954 48.954 30 60 30 H190 C201.046 30 210 38.954 210 50 C210 61.046 201.046 70 190 70 H90 V125 H165 C176.046 125 185 133.954 185 145 C185 156.046 176.046 165 165 165 H90 V260 C90 271.046 81.046 280 70 280 C58.954 280 40 271.046 40 260 V50 Z" fill="url(#sqGreen)"/>

